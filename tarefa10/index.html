<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Responsiva</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>
            Galeria Responsiva
        </h1>
    </header>
    <main>
        <ul>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/cachoeira_com_rio.png" alt="Imagem de uma cachoeira com rio">
                    <div class="titulo-paisagem">
                        <span>
                            Cachoeira com rio
                        </span>
                    </div>
                </div>
            </li>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/floresta_azul_com_vagalumes.png" alt="Imagem de uma floresta com vagalumes">
                    <div class="titulo-paisagem">
                        <span>
                            Floresta e vagalumes
                        </span>
                    </div>
                </div>
            </li>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/planicie_laranja_e_roxa.png" alt="Imagem de uma planice laranja e roxa">
                    <div class="titulo-paisagem">
                        <span>
                            Planície laranja e roxa
                        </span>
                    </div>
                </div>
            </li>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/vale_gelado.jpg" alt="Imagem de um vale coberto de gelo">
                    <div class="titulo-paisagem">
                        <span>
                            Vale gelado
                        </span>
                    </div>
                </div>
            </li>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/osais.jpg" alt="Imagem de um oásis">
                    <div class="titulo-paisagem">
                        <span>
                            Oásis
                        </span>
                    </div>
                </div>
            </li>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/planalto_rochoso.jpg" alt="Imagem de um planalto rochoso">
                    <div class="titulo-paisagem">
                        <span>
                            Planalto rochoso
                        </span>
                    </div>
                </div>
            </li>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/pantano.jpg" alt="Imagem de um pântano">
                    <div class="titulo-paisagem">
                        <span>
                            Pântano
                        </span>
                    </div>
                </div>
            </li>
            <li>
                <div class="paisagem-bloco">
                    <img class="imagem-paisagem" src="img/cerejeiras.jpg" alt="Imagem de um bosque de cerejeiras">
                    <div class="titulo-paisagem">
                        <span>
                            Bosque de cerejeiras
                        </span>
                    </div>
                </div>
            </li>
        </ul>
    </main>
    
    <footer>
        <span>Desenvolvido por: <a href="https://github.com/NicolasFielP">Nicolas Fiel</a> | Curso de programação e desenvolvimento web com: <a href="https://github.com/Thiago-Henrique-Santos">Thiago Santos</a></span>
    </footer>
</body>

</html>
